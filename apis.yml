aid: last-energy
name: Last Energy
description: 'Last Energy is an American developer and operator of micro-modular nuclear
  power plants, founded in 2019 in Washington, D.C. by Bret Kugelmass as a commercial
  spinout of the Energy Impact Center. Its flagship PWR-20 is a 20 MWe pressurized
  water reactor assembled from a few dozen factory-made, steel-encased modules that
  ship to site and are installed rather than constructed in place. Last Energy sells
  power rather than reactors: it designs, finances, owns and operates plants under
  long-term power purchase agreements for energy-intensive customers including data
  centers, metals, chemicals, cement, pulp and paper, and food and beverage. The company
  has announced projects in Texas, South Wales, Poland and Romania, entered nuclear
  site licensing in the United Kingdom, partnered with Texas A&M and DP World, and
  raised roughly $164M across a $40M Series B and a $100M Series C. Last Energy publishes
  a marketing site and a gated customer/whitepaper portal, but no public developer
  program, API, or machine-readable interface.'
